<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دعوت خاص ❤️</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<!-- محل نمایش صحنه سه بعدی -->

<div id="scene-container"></div>



<!-- رابط کاربری روی صحنه -->

<div class="ui">


<div class="intro">


<h1>
یک دعوت خاص...
</h1>


<p>
یک لحظه وقت داری؟
<br>
یک خاطره قشنگ منتظر توست ❤️
</p>


<button id="startBtn">
شروع ✨
</button>


</div>



<div class="invite" id="invite">


<h2>
دوست دارم یک قرار داشته باشیم ❤️
</h2>


<p>
تاریخ و مکان را انتخاب کن:
</p>



<input 
id="date"
placeholder="📅 تاریخ قرار">


<input 
id="place"
placeholder="📍 مکان قرار">



<div>


<button 
class="yes"
onclick="accept()">

قبول می‌کنم ❤️

</button>


<button 
class="no"
onclick="noAnswer()">

نه 😅

</button>


</div>


</div>


</div>





<!-- موتور سه بعدی -->

<script src="https://cdn.jsdelivr.net/npm/three@0.128/build/three.min.js"></script>


<!-- خواندن مدل های سه بعدی -->

<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>



<!-- صحنه -->

<script src="scene.js"></script>



<!-- منطق دکمه ها -->

<script src="script.js"></script>



</body>

</html>
